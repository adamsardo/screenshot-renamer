name: Package preview DMG
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version, e.g. 0.1.0-preview.2'
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test
      - name: Build ad-hoc preview DMG
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 14
