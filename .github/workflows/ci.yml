name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Core safety tests
        run: swift test
      - name: Package sandboxed app
        run: VERSION=0.1.0-ci ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/
          retention-days: 7
